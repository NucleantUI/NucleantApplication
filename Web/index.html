<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PRODUCT}}</title>
  <style>
    :root { color-scheme: light dark; }
    /* The page follows prefers-color-scheme, as the app inside it does. */
    html, body { margin: 0; min-height: 100%; background: light-dark(#e2e2e8, #16161a); color: light-dark(#222, #ddd); font: 14px/1.4 system-ui, sans-serif; }
    #app { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; justify-content: center; align-items: flex-start; }
    .nucleant-window { max-width: 100%; box-shadow: 0 6px 30px light-dark(rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.45)); }
    .nucleant-window:focus-visible { outline: 2px solid #6aa0ff; }
    #status { padding: 0 16px 16px; text-align: center; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="status"></div>
  <script type="module">
    import { runNucleantApp } from './nucleant-app.js';
    const status = document.getElementById('status');
    runNucleantApp({ wasm: './{{PRODUCT}}.wasm', resources: './resources.json', zoneinfo: './zoneinfo.bin', container: document.getElementById('app') })
      .catch((error) => {
        status.textContent = `Could not start {{PRODUCT}}: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
